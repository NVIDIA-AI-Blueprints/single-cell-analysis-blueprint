              uv pip install --system -r requirements.txt
              mamba install -c conda-forge -c rapidsai cupy==14.0.1 numpy==2.2.6 -y
              pip install papermill nbconvert ipykernel
              cd /notebooks/notebooks
              python3 /notebooks/.github/scripts/ci_strip_kernel_shutdown.py 02_scRNA_analysis_extended.ipynb /tmp/papermill_stripped/02_scRNA_analysis_extended.ipynb
              set +e
              papermill /tmp/papermill_stripped/02_scRNA_analysis_extended.ipynb /notebooks/results/std_02_scRNA_analysis_extended.ipynb --cwd /notebooks/notebooks --log-output --kernel python3
              rc=$?
              jupyter nbconvert --to html /notebooks/results/std_02_scRNA_analysis_extended.ipynb --output-dir /notebooks/results --output std_02_scRNA_analysis_extended
              exit $rc
            '
          if [ ! -s "results/std_02_scRNA_analysis_extended.html" ]; then
            echo "::error::results/std_02_scRNA_analysis_extended.html not created"
            exit 1
          fi

      - name: Upload executed notebook
