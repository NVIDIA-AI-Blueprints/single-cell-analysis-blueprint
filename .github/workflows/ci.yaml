        uses: actions/upload-artifact@v4
        with:
          name: single-cell-nb-02
          path: |
            results/std_02_scRNA_analysis_extended.html
            results/std_02_scRNA_analysis_extended.ipynb
          retention-days: 14
          if-no-files-found: warn

