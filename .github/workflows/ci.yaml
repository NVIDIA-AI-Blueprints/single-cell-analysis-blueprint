name: QA Test — Single-Cell Analysis Notebooks

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      test_image:
        description: "blueprint-github-test image that runs the pytest cases"
        required: false
        default: "nvcr.io/rw983xdqtcdp/auto_test_team/blueprint-github-test-image:latest"

concurrency:
  group: single-cell-notebook-gpu-${{ github.ref }}
  cancel-in-progress: false

env:
  RAPIDS_IMAGE: "nvcr.io/nvidia/rapidsai/notebooks:26.02-cuda12-py3.12"
  TEST_IMAGE: ${{ inputs.test_image || 'nvcr.io/rw983xdqtcdp/auto_test_team/blueprint-github-test-image:latest' }}

jobs:
  notebook:
    name: notebook ${{ matrix.name }}
    runs-on: arc-runners-org-nvidia-ai-bp-2-gpu
    timeout-minutes: 120
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        include:
          - name: std_01_02
            notebooks: "01_scRNA_analysis_preprocessing:std_01_scRNA_analysis_preprocessing 02_scRNA_analysis_extended:std_02_scRNA_analysis_extended"
          - name: std_03
            notebooks: "03_scRNA_analysis_with_pearson_residuals:std_03_scRNA_analysis_with_pearson_residuals"
          - name: adv_05
            notebooks: "05_spatial_demo:adv_05_spatial_demo"
          - name: adv_04
            notebooks: "04_scRNA_analysis_dask_out_of_core:adv_04_scRNA_analysis_dask_out_of_core"
          - name: adv_06
            notebooks: "06_scRNA_analysis_1.0M_brain_example:adv_06_scRNA_analysis_1.0M_brain_example"
          - name: adv_07
            notebooks: "07_perturbation_analysis_invivo_brain_example:adv_07_perturbation_analysis_invivo_brain_example"
    steps:
      - name: Checkout BP repository
        uses: actions/checkout@v4

      - name: Get System Info
        run: |
          more /etc/os-release
          nvidia-smi
          docker version

      - name: Run notebooks in the RAPIDS container
        env:
          NGC_API_KEY: ${{ secrets.NGC_API_KEY }}
          NOTEBOOKS: ${{ matrix.notebooks }}
        run: |
          set -euo pipefail
          if [ -z "${NGC_API_KEY}" ]; then
            echo "Error: secret NGC_API_KEY is not set"
            exit 1
          fi
          echo "${NGC_API_KEY}" | docker login nvcr.io -u '$oauthtoken' --password-stdin
          mkdir -p html logs
          docker run --rm --gpus all --user root \
            --shm-size=1g --ulimit memlock=-1 --ulimit stack=67108864 \
            -e NOTEBOOKS \
            -e CONDA_PREFIX=/opt/conda \
            -e UCX_TLS=tcp \
            -e UCX_MEMTYPE_CACHE=n \
            -e DASK_UCX__INFINIBAND=false \
            -e DASK_UCX__NVLINK=false \
            -v "$(pwd)":/notebooks \
            -w /notebooks \
            "${RAPIDS_IMAGE}" \
            bash -c '
              set -euo pipefail
              nvidia-smi
              curl -LsSf https://astral.sh/uv/install.sh | sh
              export PATH="$HOME/.local/bin:$PATH"
              uv pip install --system -r requirements.txt
              mamba install -c conda-forge -c rapidsai cupy==14.0.1 numpy==2.2.6 -y
              pip install papermill nbconvert ipykernel
              python -c "import numpy, cupy; print(\"numpy\", numpy.__version__, \"cupy\", cupy.__version__)"
              for pair in $NOTEBOOKS; do
                nb="${pair%%:*}"
                out="${pair##*:}"
                echo "=== papermill notebooks/${nb}.ipynb -> html/${out}.html ==="
                papermill "notebooks/${nb}.ipynb" "logs/${out}.ipynb" \
                  --cwd notebooks --kernel python3 --log-output --log-level INFO \
                  2>&1 | tee "logs/${out}.papermill.log"
                jupyter nbconvert --to html "logs/${out}.ipynb" --output "${out}" --output-dir html
                test -s "html/${out}.html"
              done
            '

      - name: Upload notebook artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: single-cell-notebook-${{ matrix.name }}
          path: |
            html/*.html
            logs/*.log
          retention-days: 14
          if-no-files-found: warn

      - name: Cleanup Docker resources
        if: always()
        run: |
          docker ps -q --filter "ancestor=${RAPIDS_IMAGE}" | xargs -r docker stop 2>/dev/null || true
          docker ps -aq --filter "ancestor=${RAPIDS_IMAGE}" | xargs -r docker rm 2>/dev/null || true
          docker rmi "${RAPIDS_IMAGE}" 2>/dev/null || true
          docker image prune -f

  test:
    needs: notebook
    if: always()
    runs-on: arc-runners-org-nvidia-ai-bp-2-gpu
    timeout-minutes: 120
    steps:
      - name: Download notebook HTMLs
        uses: actions/download-artifact@v4
        with:
          pattern: single-cell-notebook-*
          path: artifacts

      - name: Collect notebook HTMLs
        run: |
          mkdir -p html
          find artifacts -name '*.html' -exec cp {} html/ \;
          ls -la html

      - name: Run Test Code
        env:
          TEST_DOCKER_PULL_KEY: ${{ secrets.TEST_DOCKER_PULL_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${TEST_DOCKER_PULL_KEY}" ]; then
            echo "Error: secret TEST_DOCKER_PULL_KEY is not set"
            exit 1
          fi
          echo "${TEST_DOCKER_PULL_KEY}" | docker login nvcr.io --username '$oauthtoken' --password-stdin
          docker pull "${TEST_IMAGE}"
          docker run --rm \
            -v "$(pwd)/html":/app/input/single_cell_analysis/v1.2.0 \
            -v "$(pwd)":/workspace \
            "${TEST_IMAGE}" \
            pytest -m single_cell --disable-warnings --timeout=900 \
              --html=/workspace/single-cell.html --self-contained-html
          if [ ! -f single-cell.html ]; then
            echo "Error: single-cell.html report was not created"
            exit 1
          fi

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: single-cell notebooks and pytest
          path: |
            html/*.html
            single-cell.html
          retention-days: 14

      - name: Cleanup Docker resources
        if: always()
        run: |
          docker ps -q --filter "ancestor=${TEST_IMAGE}" | xargs -r docker stop 2>/dev/null || true
          docker ps -aq --filter "ancestor=${TEST_IMAGE}" | xargs -r docker rm 2>/dev/null || true
          docker rmi "${TEST_IMAGE}" 2>/dev/null || true
          docker image prune -f

      - name: Set result output
        id: set_result
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ] && [ "${{ needs.notebook.result }}" == "success" ]; then
            echo "RESULT=PASS" >> "$GITHUB_OUTPUT"
          else
            echo "RESULT=FAIL" >> "$GITHUB_OUTPUT"
          fi

      - name: Send mail
        uses: dawidd6/action-send-mail@6e71c855c9a091d80a519621b9fd3e8d252ca40c
        if: always()
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "QA Test (Single-Cell Analysis) for ${{ github.repository }}"
          to: Github-Action-Blueprint-QA@nvidia.com
          from: github-workflow-notification@gmail.com
          html_body: |
            <p>Hello,</p>
            <p>Single-cell analysis QA for <strong>${{ github.repository }}</strong> completed.<br>
            <strong>Notebooks:</strong> ${{ needs.notebook.result }}<br>
            <strong>Result:</strong> ${{ steps.set_result.outputs.RESULT }}</p>
            <p><a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}">View run</a></p>
            <p>Thanks!</p>
