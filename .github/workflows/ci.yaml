name: Notebook Execution and Test - Single-Cell Analysis

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      test_image:
        description: QA test image (blueprint-github-test)
        type: string
        default: nvcr.io/rw983xdqtcdp/auto_test_team/blueprint-github-test-image:latest

concurrency:
  group: single-cell-notebook-gpu-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  RAPIDS_IMAGE: nvcr.io/nvidia/rapidsai/notebooks:26.02-cuda12-py3.12
  TEST_IMAGE: ${{ inputs.test_image || 'nvcr.io/rw983xdqtcdp/auto_test_team/blueprint-github-test-image:latest' }}
  PYTEST_TIMEOUT: "900"
  UCX_TLS: "tcp"
  UCX_MEMTYPE_CACHE: "n"
  UCX_NET_DEVICES: "all"
  UCX_LOG_LEVEL: "error"
  UCX_WARN_UNUSED_ENV_VARS: "n"
  RAFT_USE_UCX: "0"
  RAFT_ENABLE_UCX: "0"
  RAFT_COMMS_UCX_ENABLED: "0"
  DASK_SCHEDULER: "synchronous"
  DASK_UCX__TCP: "true"
  DASK_UCX__INFINIBAND: "false"
  DASK_UCX__NVLINK: "false"
  DASK_UCX__CUDA_COPY: "false"
  CUGRAPH_USE_LEGACY_ALGO: "1"

jobs:
  notebook-01:
    runs-on: arc-runners-org-nvidia-ai-bp-2-gpu
    timeout-minutes: 120
    steps:
      - name: Checkout BP repository
        uses: actions/checkout@v4

      - name: Get System Info
        run: |
          echo "===================== System Info (notebook 01) ====================="
          more /etc/os-release
          nvidia-smi || echo "nvidia-smi not available"
          docker version

      - name: Login to nvcr.io
        env:
          NGC_API_KEY: ${{ secrets.NGC_API_KEY }}
        run: |
          if [ -z "${NGC_API_KEY:-}" ]; then
            echo "::error::repository secret NGC_API_KEY is not set"
            exit 1
          fi
          echo "${NGC_API_KEY}" | docker login nvcr.io -u '$oauthtoken' --password-stdin

      - name: Run 01_scRNA_analysis_preprocessing.ipynb in the RAPIDS container
        run: |
          mkdir -p results
          docker run --rm --gpus all \
            --shm-size=1g --ulimit memlock=-1 --ulimit stack=67108864 \
            --user root \
            -e UCX_TLS -e UCX_MEMTYPE_CACHE -e UCX_NET_DEVICES -e UCX_LOG_LEVEL -e UCX_WARN_UNUSED_ENV_VARS -e RAFT_USE_UCX -e RAFT_ENABLE_UCX -e RAFT_COMMS_UCX_ENABLED -e DASK_SCHEDULER -e DASK_UCX__TCP -e DASK_UCX__INFINIBAND -e DASK_UCX__NVLINK -e DASK_UCX__CUDA_COPY -e CUGRAPH_USE_LEGACY_ALGO \
            -e HOST_UID="$(id -u)" -e HOST_GID="$(id -g)" \
            -v "$(pwd)":/notebooks -w /notebooks \
            "${RAPIDS_IMAGE}" \
            bash -c '
              if [ -f /opt/conda/etc/profile.d/conda.sh ]; then
                source /opt/conda/etc/profile.d/conda.sh
              elif [ -f /usr/local/etc/profile.d/conda.sh ]; then
                source /usr/local/etc/profile.d/conda.sh
              else
                echo "ERROR: Could not find conda.sh to activate conda"
                exit 1
              fi
              conda activate base || exit 1
              set -uo pipefail
              trap "chown -R \${HOST_UID}:\${HOST_GID} /notebooks" EXIT
              set -e
              curl -LsSf https://astral.sh/uv/install.sh | sh
              export PATH="$HOME/.local/bin:$PATH"
              uv pip install --system -r requirements.txt
              mamba install -c conda-forge -c rapidsai cupy==14.0.1 numpy==2.2.6 -y
              pip install papermill nbconvert ipykernel
              cd /notebooks/notebooks
              python3 /notebooks/.github/scripts/ci_strip_kernel_shutdown.py 01_scRNA_analysis_preprocessing.ipynb /tmp/papermill_stripped/01_scRNA_analysis_preprocessing.ipynb
              set +e
              papermill /tmp/papermill_stripped/01_scRNA_analysis_preprocessing.ipynb /notebooks/results/std_01_scRNA_analysis_preprocessing.ipynb --cwd /notebooks/notebooks --log-output --kernel python3
              rc=$?
              jupyter nbconvert --to html /notebooks/results/std_01_scRNA_analysis_preprocessing.ipynb --output-dir /notebooks/results --output std_01_scRNA_analysis_preprocessing
              exit $rc
            '
          if [ ! -s "results/std_01_scRNA_analysis_preprocessing.html" ]; then
            echo "::error::results/std_01_scRNA_analysis_preprocessing.html not created"
            exit 1
          fi

      - name: Upload h5/dli_decoupler.h5ad for notebook 02
        uses: actions/upload-artifact@v4
        with:
          name: single-cell-h5-dli-decoupler
          path: notebooks/h5/dli_decoupler.h5ad
          retention-days: 1
          if-no-files-found: error

      - name: Upload executed notebook
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: single-cell-nb-01
          path: |
            results/std_01_scRNA_analysis_preprocessing.html
            results/std_01_scRNA_analysis_preprocessing.ipynb
          retention-days: 14
          if-no-files-found: warn

      - name: Cleanup Docker resources
        if: always()
        run: |
          docker ps --filter "ancestor=${RAPIDS_IMAGE}" -q | xargs -r docker stop 2>/dev/null || true
          docker ps -a --filter "ancestor=${RAPIDS_IMAGE}" -q | xargs -r docker rm 2>/dev/null || true
          docker rmi "${RAPIDS_IMAGE}" 2>/dev/null || true
          docker image prune -f

