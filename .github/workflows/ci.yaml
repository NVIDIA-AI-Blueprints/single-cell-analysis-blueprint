          docker image prune -f

  test:
    needs: [notebook-01, notebook-02, notebook-03, notebook-04, notebook-05, notebook-06, notebook-07]
    if: ${{ !cancelled() }}
    runs-on: arc-runners-org-nvidia-ai-bp-2-gpu
    timeout-minutes: 120
    steps:
      - name: Download executed notebooks
        uses: actions/download-artifact@v4
        with:
          pattern: single-cell-nb-*
          path: qa-input
          merge-multiple: true

      - name: Check notebook HTML files
        run: |
          missing=0
          for f in \
            std_01_scRNA_analysis_preprocessing.html \
            std_02_scRNA_analysis_extended.html \
            std_03_scRNA_analysis_with_pearson_residuals.html \
            adv_04_scRNA_analysis_dask_out_of_core.html \
            adv_05_spatial_demo.html \
            adv_06_scRNA_analysis_1.0M_brain_example.html \
            adv_07_perturbation_analysis_invivo_brain_example.html \
          ; do
            if [ ! -s "qa-input/$f" ]; then
              echo "::error::qa-input/$f missing"
              missing=1
            fi
          done
          ls -la qa-input
          exit $missing

      - name: Run Test Code
        if: always()
        env:
          TEST_DOCKER_PULL_KEY: ${{ secrets.TEST_DOCKER_PULL_KEY }}
        run: |
          if [ -z "${TEST_DOCKER_PULL_KEY:-}" ]; then
            echo "::error::repository secret TEST_DOCKER_PULL_KEY is not set"
            exit 1
          fi
          echo "${TEST_DOCKER_PULL_KEY}" | docker login nvcr.io -u '$oauthtoken' --password-stdin
          mkdir -p report
          docker run --rm \
            -v "$(pwd)/qa-input":/app/input/single_cell_analysis/v1.2.0 \
            -v "$(pwd)/report":/workspace \
            "${TEST_IMAGE}" \
            pytest testcases/test_single_cell_notebook.py -m "single_cell and notebook" \
              --timeout="${PYTEST_TIMEOUT}" --disable-warnings \
              --junitxml=/workspace/single_cell.xml \
              --html=/workspace/single_cell.html --self-contained-html
          if [ ! -s report/single_cell.html ]; then
            echo "::error::pytest report not created"
            exit 1
          fi

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: single-cell notebooks and pytest
          path: |
            qa-input/*.html
            report/single_cell.html
            report/single_cell.xml
          retention-days: 14

      - name: Cleanup Docker resources
        if: always()
        run: |
          docker ps --filter "ancestor=${TEST_IMAGE}" -q | xargs -r docker stop 2>/dev/null || true
          docker ps -a --filter "ancestor=${TEST_IMAGE}" -q | xargs -r docker rm 2>/dev/null || true
          docker rmi "${TEST_IMAGE}" 2>/dev/null || true
          docker image prune -f

      - name: Set result output
        id: set_result
        if: always()
        run: |
          echo "RESULT=$(if [ "${{ job.status }}" == 'success' ]; then echo 'PASS'; else echo 'FAIL'; fi)" >> "$GITHUB_OUTPUT"

      - name: Send mail
        uses: dawidd6/action-send-mail@6e71c855c9a091d80a519621b9fd3e8d252ca40c
        if: always()
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "QA Test (Single-Cell Analysis) for ${{ github.repository }}"
          to: Github-Action-Blueprint-QA@nvidia.com
          from: github-workflow-notification@gmail.com
          html_body: |
            <p>Hello,</p>
            <p>Single-cell analysis QA for <strong>${{ github.repository }}</strong> completed.<br>
            <strong>Result:</strong> ${{ steps.set_result.outputs.RESULT }}</p>
            <ul>
            <li>notebook-01: ${{ needs.notebook-01.result }}</li>
            <li>notebook-02: ${{ needs.notebook-02.result }}</li>
            <li>notebook-03: ${{ needs.notebook-03.result }}</li>
            <li>notebook-04: ${{ needs.notebook-04.result }}</li>
            <li>notebook-05: ${{ needs.notebook-05.result }}</li>
            <li>notebook-06: ${{ needs.notebook-06.result }}</li>
            <li>notebook-07: ${{ needs.notebook-07.result }}</li>
            </ul>
            <p><a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}">View run</a></p>
            <p>Thanks!</p>
